# Local development database. Credentials are for local use only.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autolincoln
      POSTGRES_PASSWORD: autolincoln
      POSTGRES_DB: autolincoln
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
